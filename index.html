<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bem-Vindo | Catedral Evangélica do Brasil</title>
<meta name="description" content="Central de links do departamento Bem-Vindo da Catedral Evangélica do Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul: #0E74BE;
    --dourado: #C9A227;
    --dourado-escuro: #A6811C;
    --creme: #F7F4EF;
    --texto: #2b2b2b;
    --texto-suave: #6b6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, var(--creme) 0%, #ffffff 55%);
    color: var(--texto);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 56px 20px 32px;
  }
  .wordmark{
    font-weight:700;
    font-size: clamp(34px, 8vw, 46px);
    color: var(--azul);
    letter-spacing: 0.01em;
    margin:0;
  }
  .wordmark .ponto{
    color: var(--dourado);
    margin: 0 2px;
  }
  .subtitulo{
    color: var(--dourado-escuro);
    font-weight:600;
    letter-spacing: 0.14em;
    font-size: 13px;
    text-transform: uppercase;
    margin: 10px 0 40px;
    text-align:center;
  }
  main{
    width:100%;
    max-width: 480px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .intro{
    text-align:center;
    color: var(--texto-suave);
    font-size: 15px;
    line-height:1.5;
    margin: 0 0 8px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap:16px;
    background:#ffffff;
    border:1px solid #e8e2d6;
    border-radius:16px;
    padding:18px 20px;
    text-decoration:none;
    color:inherit;
    box-shadow: 0 1px 3px rgba(20,20,20,0.04);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:active{
    transform: scale(0.98);
  }
  @media (hover:hover){
    a.card:hover{
      border-color: var(--azul);
      box-shadow: 0 6px 18px rgba(14,116,190,0.12);
      transform: translateY(-1px);
    }
  }
  .card-icone{
    flex: 0 0 auto;
    width:44px;
    height:44px;
    border-radius:12px;
    background: linear-gradient(135deg, var(--azul), #0a5690);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
  }
  .card-texto{flex:1 1 auto; min-width:0;}
  .card-titulo{
    font-weight:600;
    font-size:16px;
    margin:0 0 2px;
    color: var(--texto);
  }
  .card-desc{
    font-size:13px;
    color: var(--texto-suave);
    margin:0;
    line-height:1.4;
  }
  .card-seta{
    flex:0 0 auto;
    color:#c7c2b6;
    font-size:18px;
  }
  footer{
    margin-top:auto;
    padding-top:48px;
    text-align:center;
    color:#a8a29a;
    font-size:12px;
    line-height:1.6;
  }
  footer strong{color:#8a8578;}
</style>
</head>
<body>
  <p class="wordmark">BEM<span class="ponto">&middot;</span>VINDO</p>
  <p class="subtitulo">Acolhimento e Consolidação</p>

  <main>
    <p class="intro">Central de links do Bem-Vindo. Escolha o que você precisa abaixo.</p>

    <a class="card" href="/manual">
      <span class="card-icone">📖</span>
      <span class="card-texto">
        <p class="card-titulo">Manual do Voluntário</p>
        <p class="card-desc">Versão mais atual, sempre atualizada neste mesmo link.</p>
      </span>
      <span class="card-seta">›</span>
    </a>
  </main>

  <footer>
    <strong>Catedral Evangélica do Brasil</strong><br>
    Departamento Bem-Vindo
  </footer>
</body>
</html>
